<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090b18" />
    <title>NEON BLOCKS | Browser Tetris</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="ambient ambient--one"></div>
    <div class="ambient ambient--two"></div>
    <main class="app-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">ARCADE / 01</p>
          <h1>NEON <span>BLOCKS</span></h1>
        </div>
        <div class="status-pill"><i></i><span id="statusText">READY TO PLAY</span></div>
      </header>

      <section class="game-layout" aria-label="テトリスゲーム">
        <aside class="panel stats-panel">
          <p class="panel-label">SCOREBOARD</p>
          <div class="stat"><span>SCORE</span><strong id="score">000000</strong></div>
          <div class="stat-row">
            <div class="stat"><span>LEVEL</span><strong id="level">01</strong></div>
            <div class="stat"><span>LINES</span><strong id="lines">00</strong></div>
          </div>
          <div class="meter" aria-hidden="true"><span id="levelMeter"></span></div>
          <p class="meter-copy">NEXT LEVEL <b id="linesToLevel">10 LINES</b></p>
        </aside>

        <div class="board-wrap">
          <div class="board-frame">
            <canvas id="board" width="300" height="600" aria-label="プレイフィールド"></canvas>
            <div class="overlay" id="overlay">
              <p class="overlay-kicker" id="overlayKicker">NEON BLOCKS</p>
              <h2 id="overlayTitle">READY?</h2>
              <p id="overlayMessage">ブロックを積み上げてラインを消そう</p>
              <button id="startButton" type="button">START GAME <span>↵</span></button>
            </div>
          </div>
          <div class="mobile-controls" aria-label="タッチ操作">
            <button data-action="left" aria-label="左へ移動">←</button>
            <button data-action="rotate" aria-label="回転">↻</button>
            <button data-action="right" aria-label="右へ移動">→</button>
            <button data-action="down" aria-label="下へ移動">↓</button>
            <button data-action="drop" aria-label="ハードドロップ">⇊</button>
          </div>
        </div>

        <aside class="panel side-panel">
          <div>
            <p class="panel-label">UP NEXT</p>
            <div class="next-box"><canvas id="next" width="144" height="112" aria-label="次のピース"></canvas></div>
          </div>
          <div class="controls">
            <p class="panel-label">CONTROLS</p>
            <div><span><kbd>←</kbd><kbd>→</kbd></span><em>MOVE</em></div>
            <div><span><kbd>↑</kbd><kbd>X</kbd></span><em>ROTATE</em></div>
            <div><span><kbd>↓</kbd></span><em>SOFT DROP</em></div>
            <div><span><kbd>SPACE</kbd></span><em>HARD DROP</em></div>
            <div><span><kbd>P</kbd></span><em>PAUSE</em></div>
          </div>
          <button class="pause-button" id="pauseButton" type="button" disabled><span>Ⅱ</span> PAUSE</button>
        </aside>
      </section>
      <footer><span>10 × 20 GRID</span><b>NO INSTALL. JUST PLAY.</b><span>v1.0</span></footer>
    </main>
    <script type="module" src="script.js"></script>
  </body>
</html>
